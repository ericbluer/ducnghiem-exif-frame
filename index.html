<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bluer Exif Frame</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bluer Frame">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">

    <!-- Only Noto Serif Ethiopic — Montserrat removed (unused) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- exifr: modern full EXIF parser — reads MakerNote, XMP, lens tags across all brands -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-base:        #0a0a0a;
            --bg-card:        #141414;
            --bg-elevated:    #1c1c1c;
            --bg-input:       #222222;
            --border:         #2e2e2e;
            --text-primary:   #f0f0f0;
            --text-secondary: #888888;
            --text-muted:     #555555;
            --accent:         #3b82f6;
            --accent-dim:     rgba(59,130,246,0.15);
            --danger:         #ef4444;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
        }
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-top:    env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        .modal-scroll::-webkit-scrollbar       { width: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-track { background: transparent; }

        /* Range — taller hit area for finger use */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            height: 24px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px; width: 22px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -9px;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2), 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: #2e2e2e;
            border-radius: 2px;
        }

        /* Hide number spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        input[type=text], input[type=number], input[type=date] {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type=text]:focus,
        input[type=number]:focus,
        input[type=date]:focus { border-color: var(--accent); }
        input[type=text]::placeholder,
        input[type=number]::placeholder { color: var(--text-muted); }

        input[type=color] {
            -webkit-appearance: none;
            width: 36px; height: 36px;
            border: none; border-radius: 8px;
            cursor: pointer; padding: 0; background: none;
        }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 8px; }
        input[type=color]::-webkit-color-swatch         { border: none; border-radius: 8px; }

        input[type=checkbox] { accent-color: var(--accent); }

        .btn-icon {
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px;
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .btn-icon:active { background: var(--border); }

        .hold-btn {
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 16px;
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.1s, border-color 0.1s;
            -webkit-user-select: none; user-select: none;
        }
        .hold-btn:active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .pixel-display {
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; min-width: 72px; text-align: center;
            color: var(--accent); font-weight: 700; font-size: 13px;
            padding: 6px 8px; cursor: text; transition: border-color 0.2s;
        }
        .pixel-display:hover { border-color: var(--accent); }

        .img-card   { background: #111; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .inner-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .sec-label  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; }
        .bottom-nav { background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-anim { animation: slideUp 0.22s cubic-bezier(0.16,1,0.3,1) both; }
    </style>
</head>
<body>
    <div id="root" style="flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // ─────────────────────────────────────────────────────────────────────
        // MODULE-LEVEL CONSTANTS  (never re-created on render)
        // ─────────────────────────────────────────────────────────────────────
        const DEFAULT_LOGO  = "./signature.png";
        const JPEG_QUALITY  = 0.93; // visually identical to 1.0; ~60% smaller file
        const CONCURRENCY   = 3;    // max parallel canvas renders

        // Pre-computed once — avoids Object.entries() on every canvas draw
        const CAMERA_DB_ENTRIES = Object.entries({
            'rx100':2.7,'zv-1':2.7,'rx10':2.7,'rx1':1.0,
            'g7 x':2.7,'g5 x':2.7,'g9 x':2.7,
            's100':4.6,'s110':4.6,'s120':4.6,'ixus':5.6,
            'gr ii':1.5,'gr iii':1.5,'gr digital':4.6,'cx':5.6,'caplio':5.6,
            'x100':1.5,'x-':1.5,'gfx':0.79,'x10':3.9,'x20':3.9,'x30':3.9,
            'lx100':2.2,'lx10':2.7,'lx15':2.7,'tz':5.6,'zs':5.6,
            'tg-':5.6,'xz-':4.7,
            'coolpix a':1.5,'p900':5.6,'p1000':5.6,'1 j':2.7,'1 v':2.7,
        });

        const DEFAULT_SETTINGS = {
            borderWidthPercent:   15,
            bottomPaddingPercent: 20,
            backgroundColor: '#ffffff',
            textColor:       '#222222',
            showCameraModel: true,
            showLens:        true,
            showSettings:    true,
            showDate:        false,
            shadowEnabled:   true,
            fontFamily:      '"Noto Serif Ethiopic", serif',
            watermarkText:   '',
            captionText:     '',
            captionBold:     true,
            captionSize:     0.75,
            captionSpacing:  0,
            infoOffsetY:     0,
        };

        // ─────────────────────────────────────────────────────────────────────
        // PURE HELPERS  (outside component — zero closure / re-creation overhead)
        // ─────────────────────────────────────────────────────────────────────
        const cleanStr = (raw) => raw ? String(raw).replace(/\0/g, '').trim() : '';

        const formatExposureTime = (time) => {
            if (!time) return '';
            if (typeof time === 'string' && time.includes('/')) return time;
            if (time >= 1) return `${time}s`;
            const COMMON = [2,4,8,15,30,60,125,250,500,1000,2000,4000,8000];
            let best = Math.round(1 / time), minErr = Infinity;
            for (const den of COMMON) {
                const err = Math.abs(time - 1/den);
                if (err < minErr) { minErr = err; best = den; }
            }
            return `1/${best}s`;
        };

        const formatFNumber = (f) => {
            if (!f) return '';
            if (typeof f === 'string') {
                if (f.startsWith('f/')) return f;
                const n = parseFloat(f);
                return isNaN(n) ? f : `f/${n}`;
            }
            return `f/${Math.round(f * 10) / 10}`;
        };

        const formatISO = (iso) => {
            if (!iso) return '';
            const s = String(iso);
            return s.toLowerCase().startsWith('iso') ? s : `ISO ${s}`;
        };

        const cleanModelName = (make, model) => {
            const mk = cleanStr(make);
            let   mo = cleanStr(model);
            if (mo.toLowerCase().startsWith(mk.toLowerCase())) mo = mo.slice(mk.length).trim();
            return `${mk} ${mo}`.trim();
        };

        const formatFocalLength = (fl, fl35, make, model) => {
            if (typeof fl === 'string' && fl.includes('mm')) return fl;
            if (fl35 > 0) return `${Math.round(fl35)}mm`;
            if (!fl) return '';
            const mStr = `${make || ''} ${model || ''}`.toLowerCase();
            for (const [key, factor] of CAMERA_DB_ENTRIES) {
                if (mStr.includes(key)) return `${Math.round(fl * factor)}mm`;
            }
            if (mStr.includes('fujifilm') || mStr.includes('nikon') || mStr.includes('sony'))  return `${Math.round(fl * 1.5)}mm`;
            if (mStr.includes('olympus')  || mStr.includes('panasonic'))                        return `${Math.round(fl * 2.0)}mm`;
            if (mStr.includes('canon'))                                                          return `${Math.round(fl * 1.6)}mm`;
            return `${Math.round(fl)}mm`;
        };

        // ── EXIF reading via exifr ───────────────────────────────────────────
        //
        //  exifr reads standard EXIF IFD, MakerNote (Canon/Nikon/Fuji/Olympus/
        //  Panasonic), and XMP — covering lens info for virtually every brand.
        //
        //  Lens tag priority:
        //    LensModel        → Sony, Canon (EOS R/newer EF), Nikon Z, Olympus,
        //                       Fujifilm (MakerNote), Leica, most phones
        //    Lens             → Nikon MakerNote legacy DSLR, some Canon
        //    LensType         → Panasonic MakerNote
        //    LensID           → Nikon numeric ID fallback
        //    LensInfo /
        //    LensSpecification→ EXIF array [minFL, maxFL, minF, maxF]
        //
        const readExifFromFile = async (file) => {
            try {
                // Do NOT use `pick` together with makerNote — exifr skips
                // MakerNote entirely when a pick list is active (it doesn't know
                // which tags live inside MakerNote). Parse all, then extract what we need.
                const tags = await window.exifr.parse(file, {
                    tiff:      true,
                    exif:      true,
                    xmp:       true,
                    iptc:      false,
                    jfif:      false,
                    makerNote: true,
                    ifd0:      true,
                    ifd1:      false,
                });

                if (!tags || (!tags.Make && !tags.Model && !tags.FocalLength)) return null;

                // Resolve lens: try every known tag in priority order
                const lensRaw =
                    tags.LensModel
                    || tags.Lens
                    || tags.LensType
                    || tags.LensID
                    || tags.LensInfo
                    || tags.LensSpecification
                    || '';

                // LensInfo/LensSpecification = [minFL, maxFL, minF, maxF] array
                let lensName = '';
                if (Array.isArray(lensRaw) && lensRaw.length >= 4) {
                    const [flMin, flMax, fMin, fMax] = lensRaw.map(Number);
                    const flPart = flMin === flMax
                        ? `${Math.round(flMin)}mm`
                        : `${Math.round(flMin)}-${Math.round(flMax)}mm`;
                    const fPart = (!fMin || fMin === 0)
                        ? ''
                        : fMin === fMax ? ` f/${fMin}` : ` f/${fMin}-${fMax}`;
                    lensName = `${flPart}${fPart}`.trim();
                } else {
                    lensName = cleanStr(String(lensRaw));
                }

                // exifr returns Date objects — convert to "YYYY:MM:DD HH:MM:SS"
                const dateRaw = tags.DateTimeOriginal || tags.CreateDate;
                let dateStr = '';
                if (dateRaw instanceof Date) {
                    const pad = n => String(n).padStart(2, '0');
                    dateStr = `${dateRaw.getFullYear()}:${pad(dateRaw.getMonth()+1)}:${pad(dateRaw.getDate())} ${pad(dateRaw.getHours())}:${pad(dateRaw.getMinutes())}:${pad(dateRaw.getSeconds())}`;
                } else if (typeof dateRaw === 'string') {
                    dateStr = dateRaw;
                }

                return {
                    Make:                  cleanStr(tags.Make),
                    Model:                 cleanStr(tags.Model),
                    LensModel:             lensName,
                    FNumber:               tags.FNumber        || tags.ApertureValue,
                    ExposureTime:          tags.ExposureTime   || tags.ShutterSpeedValue,
                    ISOSpeedRatings:       tags.ISO            || tags.ISOSpeedRatings,
                    FocalLength:           tags.FocalLength,
                    FocalLengthIn35mmFilm: tags.FocalLengthIn35mmFormat,
                    DateTimeOriginal:      dateStr,
                };
            } catch(err) {
                console.warn('exifr parse failed:', err);
                return null;
            }
        };
        };

        // Build the overlay info string (pure — no side effects)
        const buildInfoText = (exif, cfg) => {
            const parts = [];
            if (cfg.showCameraModel) {
                const cam = cleanModelName(exif.Make, exif.Model);
                if (cam) parts.push(cam);
            }
            if (cfg.showLens && exif.LensModel) {
                const lens = cleanStr(exif.LensModel);
                if (lens) parts.push(lens);
            }
            if (cfg.showSettings) {
                const specs = [];
                const fl = formatFocalLength(exif.FocalLength, exif.FocalLengthIn35mmFilm, exif.Make, exif.Model);
                if (fl)                   specs.push(fl);
                if (exif.FNumber)         specs.push(formatFNumber(exif.FNumber));
                if (exif.ExposureTime)    specs.push(formatExposureTime(exif.ExposureTime));
                if (exif.ISOSpeedRatings) specs.push(formatISO(exif.ISOSpeedRatings));
                if (specs.length)         parts.push(specs.join(' '));
            }
            if (cfg.showDate && exif.DateTimeOriginal) {
                const raw = String(exif.DateTimeOriginal).split(' ')[0];
                const p   = raw.split(':');
                parts.push(p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : raw.replace(/:/g, '.'));
            }
            return parts.join('  |  ');
        };

        // ─────────────────────────────────────────────────────────────────────
        // CANVAS DRAWING  (pure — receives all data, no component state access)
        // ─────────────────────────────────────────────────────────────────────
        const drawBlock = (ctx, block, x, y, baseFontSize, cfg) => {
            if (block.type === 'logo-caption') {
                const logoW  = block.height * (block.logo.width / block.logo.height);
                const capSz  = baseFontSize * cfg.captionSize;
                ctx.save();
                ctx.font = `${cfg.captionBold ? '700' : '400'} ${capSz}px ${cfg.fontFamily}`;
                if (cfg.captionSpacing > 0) try { ctx.letterSpacing = `${cfg.captionSpacing / 100}em`; } catch(_){}
                const gap    = baseFontSize * 0.8;
                const totalW = logoW + gap + ctx.measureText(block.caption).width;
                const sx     = x - totalW / 2;
                ctx.drawImage(block.logo, sx, y - block.height / 2, logoW, block.height);
                ctx.textAlign = 'left';
                ctx.fillText(block.caption, sx + logoW + gap, y);
                ctx.restore();
            } else if (block.type === 'image') {
                const logoW = block.height * (block.content.width / block.content.height);
                ctx.drawImage(block.content, x - logoW / 2, y - block.height / 2, logoW, block.height);
            } else {
                ctx.save();
                ctx.textAlign = 'center';
                if (block.style === 'small') {
                    ctx.font = `300 ${baseFontSize * 0.55}px ${cfg.fontFamily}`;
                    try { ctx.letterSpacing = '0.15em'; } catch(_){}
                } else if (block.style === 'caption') {
                    ctx.font = `${cfg.captionBold ? '700' : '400'} ${baseFontSize * cfg.captionSize}px ${cfg.fontFamily}`;
                    if (cfg.captionSpacing > 0) try { ctx.letterSpacing = `${cfg.captionSpacing / 100}em`; } catch(_){}
                } else {
                    ctx.font = `600 ${baseFontSize}px ${cfg.fontFamily}`;
                }
                ctx.fillText(block.content, x, y);
                ctx.restore();
            }
        };

        const drawFrameOnCanvas = (canvas, ctx, sourceImg, exif, cfg, logoImg) => {
            const srcW = sourceImg.naturalWidth  || sourceImg.width;
            const srcH = sourceImg.naturalHeight || sourceImg.height;
            if (!srcW || !srcH) return;

            const short      = Math.min(srcW, srcH);
            const baseP      = Math.floor(short * cfg.borderWidthPercent / 100);
            const isLandscape = srcW > srcH;
            const ratio       = isLandscape ? 5/4 : 4/5;
            const minBottom   = Math.floor(short * cfg.bottomPaddingPercent / 100 * (isLandscape ? 1.0 : 1.25));

            // Calculate canvas dimensions
            let cW, cH, topP, sideP;
            const wTry   = srcW + baseP * 2;
            const calcBot = wTry / ratio - srcH - baseP;

            if (calcBot >= minBottom) {
                cW = wTry; cH = wTry / ratio; topP = baseP; sideP = baseP;
            } else {
                cH    = srcH + baseP + minBottom;
                cW    = cH * ratio;
                topP  = baseP;
                sideP = (cW - srcW) / 2;
            }

            canvas.width  = cW;
            canvas.height = cH;

            // Fill background
            ctx.fillStyle = cfg.backgroundColor;
            ctx.fillRect(0, 0, cW, cH);

            // Draw photo (with optional shadow)
            ctx.save();
            if (cfg.shadowEnabled) {
                ctx.shadowColor   = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur    = short * 0.04;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = short * 0.01;
            }
            ctx.drawImage(sourceImg, Math.floor(sideP), Math.floor(topP), srcW, srcH);
            ctx.restore();

            // Overlay text / logo
            ctx.fillStyle    = cfg.textColor;
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';

            const fs          = short * 0.035; // baseFontSize
            const cx          = cW / 2;
            const lineH       = fs * 1.5;
            const logoH       = fs * 2.5;
            const gap         = fs * 0.4;
            const marginBot   = fs * 2.2;
            const offsetPx    = (cfg.infoOffsetY || 0) * (short / 1000);
            const captionText = cfg.captionText;
            const infoText    = buildInfoText(exif, cfg);

            // Build render blocks
            const blocks = [];
            if (logoImg && captionText) {
                blocks.push({ type: 'logo-caption', logo: logoImg, caption: captionText, height: logoH });
            } else {
                if (captionText)       blocks.push({ type: 'text', content: captionText, style: 'caption', height: lineH });
                if (logoImg)           blocks.push({ type: 'image', content: logoImg, height: logoH });
                else if (cfg.watermarkText) blocks.push({ type: 'text', content: cfg.watermarkText, style: 'bold', height: lineH });
            }
            if (infoText) blocks.push({ type: 'text', content: infoText, style: 'small', height: lineH });

            const infoBlock  = blocks.find(b => b.style === 'small');
            const upperBlock = blocks.find(b => b !== infoBlock);

            if (infoBlock) {
                const infoY  = cH - marginBot + offsetPx;
                drawBlock(ctx, infoBlock, cx, infoY, fs, cfg);
                if (upperBlock) {
                    drawBlock(ctx, upperBlock, cx, infoY - infoBlock.height / 2 - gap - upperBlock.height / 2, fs, cfg);
                }
            } else if (upperBlock) {
                drawBlock(ctx, upperBlock, cx, cH - marginBot + offsetPx, fs, cfg);
            }
        };

        // ─────────────────────────────────────────────────────────────────────
        // SUB-COMPONENTS
        // ─────────────────────────────────────────────────────────────────────

        // Press-and-hold repeating button
        function HoldButton({ onStep, children, className, style }) {
            const timerRef    = useRef(null);
            const intervalRef = useRef(null);
            const cbRef       = useRef(onStep);
            const isTouchRef  = useRef(false); // guard: prevent mousedown firing after touchstart
            useEffect(() => { cbRef.current = onStep; });

            const stop = useCallback(() => {
                clearTimeout(timerRef.current);
                clearInterval(intervalRef.current);
            }, []);

            const startRepeat = useCallback(() => {
                stop();
                cbRef.current();
                timerRef.current = setTimeout(() => {
                    intervalRef.current = setInterval(() => cbRef.current(), 80);
                }, 400);
            }, [stop]);

            const handleTouchStart = useCallback((e) => {
                e.preventDefault();       // prevents the subsequent mousedown
                isTouchRef.current = true;
                startRepeat();
            }, [startRepeat]);

            const handleMouseDown = useCallback((e) => {
                if (isTouchRef.current) return; // already handled by touch
                startRepeat();
            }, [startRepeat]);

            const handleTouchEnd = useCallback(() => {
                stop();
                // Reset touch flag after a short delay (mousedown fires ~300ms after touchend)
                setTimeout(() => { isTouchRef.current = false; }, 500);
            }, [stop]);

            useEffect(() => () => stop(), [stop]);

            return (
                <button className={className} style={style}
                    onMouseDown={handleMouseDown} onMouseUp={stop} onMouseLeave={stop}
                    onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd}>
                    {children}
                </button>
            );
        }

        // Slider with ± hold buttons on each side
        const SliderRow = React.memo(function SliderRow({ label, value, min, max, onChange, unit = '%', step = 1 }) {
            return (
                <div>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                        <span style={{ fontSize:14, fontWeight:500 }}>{label}</span>
                        <span style={{ background:'var(--bg-elevated)', border:'1px solid var(--border)', color:'var(--accent)', fontSize:12, fontWeight:700, borderRadius:7, minWidth:48, textAlign:'center', padding:'3px 8px' }}>
                            {value}{unit}
                        </span>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <HoldButton className="hold-btn" onStep={() => onChange(Math.max(min, value - step))}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14"/></svg>
                        </HoldButton>
                        <input type="range" min={min} max={max} step={step} value={value}
                            onChange={e => onChange(Number(e.target.value))} style={{ flex:1 }} />
                        <HoldButton className="hold-btn" onStep={() => onChange(Math.min(max, value + step))}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>
                        </HoldButton>
                    </div>
                </div>
            );
        });

        // Info-offset: hold-to-repeat arrows + click-to-type value
        function InfoOffsetControl({ value, onChange }) {
            const [editing, setEditing] = useState(false);
            const [tempVal, setTempVal] = useState(String(value));
            const inputRef = useRef(null);

            useEffect(() => { if (!editing) setTempVal(String(value)); }, [value, editing]);
            useEffect(() => { if (editing)  inputRef.current?.select(); }, [editing]);

            const commit = () => {
                const n = parseInt(tempVal, 10);
                if (!isNaN(n)) onChange(n); else setTempVal(String(value));
                setEditing(false);
            };

            return (
                <div>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                        <span style={{ fontSize:14, fontWeight:500 }}>Vị trí dòng info</span>
                        {editing ? (
                            <input ref={inputRef} type="number" value={tempVal}
                                onChange={e => setTempVal(e.target.value)}
                                onBlur={commit}
                                onKeyDown={e => { if (e.key==='Enter') commit(); if (e.key==='Escape') { setEditing(false); setTempVal(String(value)); }}}
                                style={{ width:80, textAlign:'center', background:'var(--bg-input)', border:'1px solid var(--accent)', borderRadius:8, color:'var(--accent)', fontWeight:700, fontSize:13, padding:'4px 8px' }}
                                autoFocus />
                        ) : (
                            <span className="pixel-display" title="Nhấn để nhập trực tiếp" onClick={() => setEditing(true)}>
                                {value > 0 ? `+${value}` : value} px
                            </span>
                        )}
                    </div>
                    <div className="inner-card" style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <HoldButton className="hold-btn" style={{ flex:1 }} onStep={() => onChange(value - 1)}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                            <span style={{ fontSize:12, marginLeft:6, color:'var(--text-secondary)' }}>Lên</span>
                        </HoldButton>
                        <span style={{ fontSize:11, color:'var(--text-muted)', flexShrink:0 }}>giữ để chạy</span>
                        <HoldButton className="hold-btn" style={{ flex:1 }} onStep={() => onChange(value + 1)}>
                            <span style={{ fontSize:12, marginRight:6, color:'var(--text-secondary)' }}>Xuống</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                        </HoldButton>
                    </div>
                </div>
            );
        }

        // Inline SVG icons — plain objects, no wrapper component
        const IC = {
            Camera:  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>,
            Upload:  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
            ImgOff:  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21"/></svg>,
            ImgSm:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21"/></svg>,
            Settings:<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>,
            Trash:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>,
            X:       <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>,
            Check:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>,
            Share:   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>,
            DlAll:   <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v11zM12 11v6M9 14l3 3 3-3"/></svg>,
            Spin:    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Edit:    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            ImgPlus: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7m4 10l-4-4-4 4m6-6l4 4m2-10v6m3-3h-6"/></svg>,
            Reset:   <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M21 21v-5h-5"/></svg>,
            Alert:   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>,
        };

        // ─────────────────────────────────────────────────────────────────────
        // MAIN APP
        // ─────────────────────────────────────────────────────────────────────
        function App() {
            const [images,         setImages]         = useState([]);
            const [settingsOpen,   setSettingsOpen]   = useState(false);
            const [editingId,      setEditingId]      = useState(null);
            const [activeTab,      setActiveTab]      = useState('layout');
            const [libsLoaded,     setLibsLoaded]     = useState(false);
            const [signatureUrl,   setSignatureUrl]   = useState(null);
            const [sigError,       setSigError]       = useState(false);
            const [settings,       setSettings]       = useState(DEFAULT_SETTINGS);
            const [manualForm,     setManualForm]     = useState({ make:'',model:'',lens:'',focalLength:'',aperture:'',shutter:'',iso:'',date:'' });

            // logoImg ref — canvas drawing reads this without causing re-renders
            const logoRef = useRef(null);
            // settingsRef — canvas jobs always use the latest settings, never a stale closure
            const settingsRef = useRef(settings);
            useEffect(() => { settingsRef.current = settings; }, [settings]);
            // Concurrency guard — prevent double-processing the same image
            const processingSet = useRef(new Set());

            // ── Init ──────────────────────────────────────────────────────
            useEffect(() => {
                const poll = setInterval(() => {
                    // exifr exposes itself as window.exifr (UMD build)
                    if (window.exifr) { setLibsLoaded(true); clearInterval(poll); }
                }, 100);
                try {
                    const saved = localStorage.getItem('bluer_settings');
                    if (saved) setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(saved) });
                } catch(_) {}
                const savedSig = localStorage.getItem('bluer_signature');
                setSignatureUrl(savedSig || DEFAULT_LOGO || null);
                return () => clearInterval(poll);
            }, []);

            useEffect(() => {
                localStorage.setItem('bluer_settings', JSON.stringify(settings));
            }, [settings]);

            // Load signature into ref (no render trigger on canvas use)
            useEffect(() => {
                setSigError(false);
                if (!signatureUrl) { logoRef.current = null; return; }
                const img   = new Image();
                img.src     = signatureUrl;
                img.onload  = () => { logoRef.current = img; };
                img.onerror = () => { setSigError(true); logoRef.current = null; };
            }, [signatureUrl]);

            // ── Core: render one image item → { finalUrl, exif } ─────────
            const renderItem = useCallback(async (item) => {
                // Use manualExif if provided, otherwise parse EXIF via exifr
                let exif = item.manualExif || null;
                if (!exif) {
                    try {
                        exif = await readExifFromFile(item.file);
                    } catch(_) {}
                }
                return new Promise((resolve) => {
                    const src = new Image();
                    src.src   = item.previewUrl;
                    src.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx    = canvas.getContext('2d');
                        // Always read settingsRef — never a stale closure
                        drawFrameOnCanvas(canvas, ctx, src, exif || {}, settingsRef.current, logoRef.current);
                        resolve({ finalUrl: canvas.toDataURL('image/jpeg', JPEG_QUALITY), exif });
                    };
                    src.onerror = () => resolve(null);
                });
            }, []);

            // Process one item with status updates + concurrency guard
            const processOne = useCallback(async (item) => {
                if (processingSet.current.has(item.id)) return;
                processingSet.current.add(item.id);
                setImages(prev => prev.map(p => p.id === item.id ? { ...p, status: 'processing' } : p));

                const result = await renderItem(item);

                processingSet.current.delete(item.id);
                setImages(prev => prev.map(p =>
                    p.id === item.id
                        ? result
                            ? { ...p, finalUrl: result.finalUrl, exif: result.exif, status: 'done' }
                            : { ...p, status: 'error' }
                        : p
                ));
            }, [renderItem]);

            // Process N items with max CONCURRENCY parallel workers
            const processMany = useCallback(async (items) => {
                const queue = [...items];
                await Promise.all(
                    Array.from({ length: Math.min(CONCURRENCY, items.length) }, async () => {
                        while (queue.length) await processOne(queue.shift());
                    })
                );
            }, [processOne]);

            // Re-process all non-busy images (reads current images via setState callback)
            const reProcessAll = useCallback(() => {
                setImages(prev => {
                    const ready = prev.filter(i => i.status !== 'processing');
                    if (ready.length) processMany(ready);
                    return prev; // no state mutation, just triggering side-effect
                });
            }, [processMany]);

            // ── File upload ───────────────────────────────────────────────
            const handleFileUpload = (e) => {
                if (!e.target.files?.length) return;
                const newItems = Array.from(e.target.files).map(file => ({
                    id:         Math.random().toString(36).slice(2, 11),
                    file,
                    previewUrl: URL.createObjectURL(file),
                    finalUrl:   null,
                    exif:       null,
                    manualExif: null,
                    status:     'pending',
                }));
                setImages(prev => [...prev, ...newItems]);
                processMany(newItems); // pass directly — no setTimeout needed
                setSettingsOpen(false);
                e.target.value = '';
            };

            // ── Signature ─────────────────────────────────────────────────
            const handleSigUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const r = new FileReader();
                r.onloadend = () => {
                    try { localStorage.setItem('bluer_signature', r.result); } catch(_) {}
                    setSignatureUrl(r.result);
                };
                r.readAsDataURL(file);
                e.target.value = '';
            };
            const removeSig = () => {
                setSignatureUrl(null);
                logoRef.current = null;
                localStorage.removeItem('bluer_signature');
            };

            // ── Manual EXIF ───────────────────────────────────────────────
            const openEdit = (img) => {
                setEditingId(img.id);
                const d = img.exif || {};
                setManualForm({
                    make:        d.Make   || '',
                    model:       d.Model  || '',
                    lens:        d.LensModel || '',
                    focalLength: d.FocalLengthIn35mmFilm || d.FocalLength || '',
                    aperture:    d.FNumber || '',
                    shutter:     d.ExposureTime
                                    ? (d.ExposureTime < 1 ? `1/${Math.round(1/d.ExposureTime)}` : String(d.ExposureTime))
                                    : '',
                    iso:         d.ISOSpeedRatings || '',
                    date:        d.DateTimeOriginal ? d.DateTimeOriginal.split(' ')[0].replace(/:/g, '-') : '',
                });
            };

            const saveEdit = () => {
                const img = images.find(i => i.id === editingId);
                if (!img) return;
                const newExif = {
                    Make:                  manualForm.make,
                    Model:                 manualForm.model,
                    LensModel:             manualForm.lens,
                    FNumber:               manualForm.aperture,
                    ExposureTime:          manualForm.shutter,
                    ISOSpeedRatings:       manualForm.iso,
                    FocalLengthIn35mmFilm: manualForm.focalLength,
                    FocalLength:           0,
                    DateTimeOriginal:      manualForm.date ? `${manualForm.date.replace(/-/g, ':')} 00:00:00` : '',
                };
                const updated = { ...img, manualExif: newExif, status: 'pending' };
                setImages(prev => prev.map(p => p.id === editingId ? updated : p));
                setEditingId(null);
                processOne(updated);
            };

            // ── Save / Share ──────────────────────────────────────────────
            const toFile = async (dataUrl, name) => {
                const blob = await (await fetch(dataUrl)).blob();
                return new File([blob], name, { type: 'image/jpeg' });
            };

            const shareSingle = async (img) => {
                if (!img.finalUrl) return;
                const name = `${img.file.name.replace(/\.[^/.]+$/, '')}_framed.jpg`;
                if (navigator.share && navigator.canShare) {
                    try {
                        const f = await toFile(img.finalUrl, name);
                        if (navigator.canShare({ files:[f] })) { await navigator.share({ files:[f] }); return; }
                    } catch(_) {}
                }
                const a = Object.assign(document.createElement('a'), { href: img.finalUrl, download: name });
                document.body.appendChild(a); a.click(); a.remove();
            };

            const saveAll = async () => {
                const done = images.filter(i => i.status === 'done' && i.finalUrl);
                if (!done.length) return;
                if (navigator.share && navigator.canShare) {
                    try {
                        const files = await Promise.all(done.map(i => toFile(i.finalUrl, `${i.file.name.replace(/\.[^/.]+$/, '')}_framed.jpg`)));
                        if (navigator.canShare({ files })) { await navigator.share({ files }); return; }
                    } catch(_) {}
                }
                if (window.JSZip) {
                    const zip = new window.JSZip();
                    done.forEach(i => zip.file(`${i.file.name.replace(/\.[^/.]+$/, '')}_framed.jpg`, i.finalUrl.split(',')[1], { base64:true }));
                    const blob = await zip.generateAsync({ type:'blob' });
                    const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'bluer_frames.zip' });
                    document.body.appendChild(a); a.click(); a.remove();
                }
            };

            // ── Settings reset (per-tab) ──────────────────────────────────
            const resetTab = (tab) => {
                const D = DEFAULT_SETTINGS;
                setSettings(prev => {
                    if (tab === 'layout')  return { ...prev, borderWidthPercent:D.borderWidthPercent, bottomPaddingPercent:D.bottomPaddingPercent, shadowEnabled:D.shadowEnabled, infoOffsetY:D.infoOffsetY };
                    if (tab === 'color')   return { ...prev, backgroundColor:D.backgroundColor, textColor:D.textColor };
                    if (tab === 'content') return { ...prev, captionBold:D.captionBold, captionSize:D.captionSize, captionSpacing:D.captionSpacing, showCameraModel:D.showCameraModel, showLens:D.showLens, showSettings:D.showSettings, showDate:D.showDate };
                    return prev;
                });
            };

            // useMemo: avoid filter scan on every render
            const doneCount = useMemo(() => images.filter(i => i.status === 'done').length, [images]);

            // ── Render ────────────────────────────────────────────────────
            return (
                <div style={{ display:'flex', flexDirection:'column', height:'100%', background:'var(--bg-base)', color:'var(--text-primary)' }}>

                    {/* Header */}
                    <header style={{ background:'var(--bg-card)', borderBottom:'1px solid var(--border)', padding:'12px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                            <span style={{ color:'var(--accent)' }}>{IC.Camera}</span>
                            <h1 style={{ fontSize:18, fontWeight:700, margin:0 }}>Bluer Exif Frame</h1>
                        </div>
                        <label style={{ background:'var(--accent)', padding:8, borderRadius:'50%', cursor: libsLoaded ? 'pointer' : 'default', opacity: libsLoaded ? 1 : 0.4, display:'flex', alignItems:'center', justifyContent:'center' }}>
                            <span style={{ color:'#fff' }}>{libsLoaded ? IC.Upload : IC.Spin}</span>
                            <input type="file" multiple accept="image/*" style={{ display:'none' }} onChange={handleFileUpload} disabled={!libsLoaded} />
                        </label>
                    </header>

                    {/* Main */}
                    <main style={{ flex:1, overflowY:'auto', padding:16, paddingBottom:88 }}>
                        {images.length === 0 ? (
                            <div onClick={() => libsLoaded && document.querySelector('input[type=file]')?.click()}
                                style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'60vh', border:'2px dashed var(--border)', background:'var(--bg-card)', borderRadius:18, cursor: libsLoaded ? 'pointer' : 'default' }}>
                                <span style={{ color:'var(--text-muted)', marginBottom:12 }}>{IC.ImgOff}</span>
                                <p style={{ color:'var(--text-secondary)', fontWeight:500, margin:0 }}>
                                    {libsLoaded ? 'Chạm để thêm ảnh' : 'Đang tải thư viện...'}
                                </p>
                            </div>
                        ) : (
                            <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
                                {images.map(img => (
                                    <div key={img.id} className="img-card">
                                        {/* Preview area */}
                                        <div style={{ position:'relative', background:'#0d0d0d', minHeight:180, display:'flex', alignItems:'center', justifyContent:'center' }}>
                                            {img.status === 'processing' && (
                                                <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.55)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1 }}>
                                                    <span style={{ color:'var(--accent)' }}>{IC.Spin}</span>
                                                </div>
                                            )}
                                            <img src={img.finalUrl || img.previewUrl} style={{ width:'100%', height:'auto', objectFit:'contain', opacity: img.finalUrl ? 1 : 0.3 }} />
                                        </div>
                                        {/* Card footer */}
                                        <div style={{ padding:12 }}>
                                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                                                <div style={{ flex:1, overflow:'hidden', marginRight:8 }}>
                                                    <p style={{ fontSize:11, fontWeight:700, color:'var(--text-secondary)', margin:0, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{img.file.name}</p>
                                                    {img.status === 'done' && !img.exif && !img.manualExif && (
                                                        <button onClick={() => openEdit(img)} style={{ display:'flex', alignItems:'center', gap:4, fontSize:10, fontWeight:700, background:'var(--accent-dim)', color:'var(--accent)', border:'1px solid rgba(59,130,246,0.3)', borderRadius:6, padding:'3px 8px', marginTop:4, cursor:'pointer' }}>
                                                            {IC.Edit} Nhập thông tin
                                                        </button>
                                                    )}
                                                    {img.status === 'done' && (img.exif || img.manualExif) && (
                                                        <button onClick={() => openEdit(img)} style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, color:'var(--text-muted)', background:'none', border:'none', marginTop:4, cursor:'pointer', padding:0 }}>
                                                            {IC.Edit} Sửa thông số
                                                        </button>
                                                    )}
                                                </div>
                                                <button onClick={() => setImages(p => p.filter(i => i.id !== img.id))} style={{ color:'var(--text-muted)', background:'none', border:'none', padding:8, cursor:'pointer' }}>
                                                    {IC.Trash}
                                                </button>
                                            </div>
                                            <button onClick={() => shareSingle(img)} disabled={!img.finalUrl}
                                                style={{ width:'100%', padding:'12px 0', borderRadius:10, fontSize:13, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', gap:8, background:'var(--bg-elevated)', border:'1px solid var(--border)', color: img.finalUrl ? 'var(--text-primary)' : 'var(--text-muted)', cursor: img.finalUrl ? 'pointer' : 'default', transition:'transform 0.1s' }}
                                                onMouseDown={e => e.currentTarget.style.transform='scale(0.97)'}
                                                onMouseUp={e => e.currentTarget.style.transform='scale(1)'}
                                                onTouchStart={e => e.currentTarget.style.transform='scale(0.97)'}
                                                onTouchEnd={e => e.currentTarget.style.transform='scale(1)'}>
                                                <span style={{ color:'var(--accent)' }}>{IC.Share}</span> Lưu / Chia sẻ
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Manual EXIF modal */}
                    {editingId && (
                        <div onClick={() => setEditingId(null)}
                            style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.8)', display:'flex', alignItems:'center', justifyContent:'center', padding:16, zIndex:60 }}>
                            <div onClick={e => e.stopPropagation()} className="modal-anim"
                                style={{ width:'100%', maxWidth:400, background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:18, display:'flex', flexDirection:'column', maxHeight:'90vh' }}>
                                <div style={{ padding:'16px 16px 12px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                    <h3 style={{ margin:0, fontWeight:700, fontSize:17 }}>Nhập thông số</h3>
                                    <button className="btn-icon" onClick={() => setEditingId(null)}>{IC.X}</button>
                                </div>
                                <div className="modal-scroll" style={{ padding:16, overflowY:'auto', display:'flex', flexDirection:'column', gap:12 }}>
                                    {[
                                        ['make',        'Hãng',            'Sony, Canon...'],
                                        ['model',       'Tên máy',         'A7 IV...'],
                                        ['lens',        'Ống kính (Lens)', 'FE 24-70mm F2.8 GM...'],
                                        ['focalLength', 'Tiêu cự (mm)',    '50'],
                                        ['aperture',    'Khẩu độ',         '2.8'],
                                        ['shutter',     'Tốc độ',          '1/250'],
                                        ['iso',         'ISO',             '400'],
                                    ].map(([key, label, ph]) => (
                                        <div key={key}>
                                            <span className="sec-label">{label}</span>
                                            <input type="text" value={manualForm[key]} placeholder={ph}
                                                onChange={e => setManualForm(f => ({ ...f, [key]: e.target.value }))} />
                                        </div>
                                    ))}
                                    <div>
                                        <span className="sec-label">Ngày</span>
                                        <input type="date" value={manualForm.date}
                                            onChange={e => setManualForm(f => ({ ...f, date: e.target.value }))} />
                                    </div>
                                </div>
                                <div style={{ padding:16, borderTop:'1px solid var(--border)' }}>
                                    <button onClick={saveEdit} style={{ width:'100%', padding:'13px 0', background:'var(--accent)', color:'#fff', borderRadius:12, fontWeight:700, fontSize:15, border:'none', cursor:'pointer' }}>
                                        Lưu
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom nav */}
                    <div className="bottom-nav" style={{ position:'fixed', bottom:0, left:0, right:0, display:'flex', justifyContent:'space-around', alignItems:'center', padding:'8px 0', paddingBottom:'calc(8px + env(safe-area-inset-bottom))', zIndex:40 }}>
                        <button onClick={() => setSettingsOpen(v => !v)}
                            style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'4px 20px', color: settingsOpen ? 'var(--accent)' : 'var(--text-secondary)', background:'none', border:'none', cursor:'pointer' }}>
                            {IC.Settings}
                            <span style={{ fontSize:10, fontWeight:500 }}>Cấu hình</span>
                        </button>
                        {images.length > 0 && (
                            <button onClick={reProcessAll}
                                style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'4px 20px', color:'var(--text-secondary)', background:'none', border:'none', cursor:'pointer' }}>
                                {IC.Check}
                                <span style={{ fontSize:10, fontWeight:500 }}>Làm mới</span>
                            </button>
                        )}
                        {doneCount > 1 && (
                            <button onClick={saveAll}
                                style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'4px 20px', color:'var(--accent)', background:'none', border:'none', cursor:'pointer' }}>
                                {IC.DlAll}
                                <span style={{ fontSize:10, fontWeight:700 }}>Lưu tất cả</span>
                            </button>
                        )}
                    </div>

                    {/* Settings sheet */}
                    {settingsOpen && (
                        <div onClick={() => setSettingsOpen(false)}
                            style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'flex-end', justifyContent:'center', zIndex:50 }}>
                            <div onClick={e => e.stopPropagation()} className="modal-anim"
                                style={{ width:'100%', maxWidth:480, background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'18px 18px 0 0', display:'flex', flexDirection:'column', maxHeight:'85vh' }}>

                                {/* Sheet header */}
                                <div style={{ padding:'16px 16px 12px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                    <h3 style={{ margin:0, fontWeight:700, fontSize:17 }}>Tùy chỉnh</h3>
                                    <div style={{ display:'flex', gap:8 }}>
                                        <button className="btn-icon" title="Đặt lại tab này" onClick={() => resetTab(activeTab)}>{IC.Reset}</button>
                                        <button className="btn-icon" onClick={() => setSettingsOpen(false)}>{IC.X}</button>
                                    </div>
                                </div>

                                {/* Tabs */}
                                <div style={{ display:'flex', gap:6, margin:'12px 16px 0', background:'var(--bg-base)', padding:5, borderRadius:12 }}>
                                    {[['layout','Bố cục'],['color','Màu sắc'],['content','Nội dung']].map(([id, label]) => (
                                        <button key={id} onClick={() => setActiveTab(id)}
                                            style={{ flex:1, padding:'8px 0', borderRadius:8, fontSize:11, fontWeight:700, textTransform:'uppercase', border: activeTab===id ? '1px solid var(--border)' : '1px solid transparent', background: activeTab===id ? 'var(--bg-elevated)' : 'transparent', color: activeTab===id ? 'var(--accent)' : 'var(--text-muted)', cursor:'pointer' }}>
                                            {label}
                                        </button>
                                    ))}
                                </div>

                                {/* Tab content */}
                                <div className="modal-scroll" style={{ padding:'20px 16px', overflowY:'auto', display:'flex', flexDirection:'column', gap:24 }}>

                                    {activeTab === 'layout' && <>
                                        <SliderRow label="Độ dày viền"       value={settings.borderWidthPercent}  min={0}  max={30} onChange={v => setSettings(s => ({...s, borderWidthPercent:v}))} />
                                        <SliderRow label="Khoảng dưới (Min)" value={settings.bottomPaddingPercent} min={5} max={50} onChange={v => setSettings(s => ({...s, bottomPaddingPercent:v}))} />
                                        <InfoOffsetControl value={settings.infoOffsetY} onChange={v => setSettings(s => ({...s, infoOffsetY:v}))} />
                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingTop:12, borderTop:'1px solid var(--border)' }}>
                                            <span style={{ fontSize:14, fontWeight:500 }}>Đổ bóng</span>
                                            <input type="checkbox" style={{ width:18, height:18 }} checked={settings.shadowEnabled} onChange={e => setSettings(s => ({...s, shadowEnabled:e.target.checked}))} />
                                        </div>
                                    </>}

                                    {activeTab === 'color' && <>
                                        {[['backgroundColor','Màu nền'],['textColor','Màu chữ']].map(([key, label]) => (
                                            <div key={key} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'var(--bg-elevated)', border:'1px solid var(--border)', borderRadius:12, padding:'12px 14px' }}>
                                                <span style={{ fontSize:14, fontWeight:500 }}>{label}</span>
                                                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                                                    <span style={{ fontSize:11, color:'var(--text-secondary)', fontFamily:'monospace' }}>{settings[key]}</span>
                                                    <input type="color" value={settings[key]} onChange={e => setSettings(s => ({...s, [key]:e.target.value}))} />
                                                </div>
                                            </div>
                                        ))}
                                    </>}

                                    {activeTab === 'content' && <>
                                        {/* Caption block */}
                                        <div className="inner-card" style={{ display:'flex', flexDirection:'column', gap:12 }}>
                                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                                <span className="sec-label" style={{ marginBottom:0 }}>Tiêu đề (Caption)</span>
                                                <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, fontWeight:700, color:'var(--text-secondary)', cursor:'pointer' }}>
                                                    <input type="checkbox" checked={settings.captionBold} onChange={e => setSettings(s => ({...s, captionBold:e.target.checked}))} /> Đậm
                                                </label>
                                            </div>
                                            <input type="text" value={settings.captionText} placeholder="VD: A Sunday Morning"
                                                onChange={e => setSettings(s => ({...s, captionText:e.target.value}))} />
                                            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
                                                <div>
                                                    <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                                                        <span style={{ fontSize:10, color:'var(--text-muted)' }}>Kích thước</span>
                                                        <span style={{ fontSize:10, color:'var(--accent)', background:'var(--bg-input)', borderRadius:4, padding:'1px 5px' }}>{settings.captionSize.toFixed(2)}x</span>
                                                    </div>
                                                    <input type="range" min="0.5" max="1.5" step="0.05" value={settings.captionSize}
                                                        onChange={e => setSettings(s => ({...s, captionSize:Number(e.target.value)}))} />
                                                </div>
                                                <div>
                                                    <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                                                        <span style={{ fontSize:10, color:'var(--text-muted)' }}>Giãn chữ</span>
                                                        <span style={{ fontSize:10, color:'var(--accent)', background:'var(--bg-input)', borderRadius:4, padding:'1px 5px' }}>{settings.captionSpacing}%</span>
                                                    </div>
                                                    <input type="range" min="0" max="50" step="1" value={settings.captionSpacing}
                                                        onChange={e => setSettings(s => ({...s, captionSpacing:Number(e.target.value)}))} />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Info toggles */}
                                        <div>
                                            <span className="sec-label">Thông tin hiển thị</span>
                                            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                                                {[['showCameraModel','Tên Máy'],['showLens','Ống Kính'],['showSettings','Thông Số'],['showDate','Ngày']].map(([key, label]) => (
                                                    <label key={key} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 12px', borderRadius:10, cursor:'pointer', background: settings[key] ? 'var(--accent-dim)' : 'var(--bg-elevated)', border: settings[key] ? '1px solid rgba(59,130,246,0.4)' : '1px solid var(--border)', color: settings[key] ? 'var(--accent)' : 'var(--text-secondary)' }}>
                                                        <span style={{ fontSize:12, fontWeight:700 }}>{label}</span>
                                                        <input type="checkbox" checked={settings[key]} style={{ width:15, height:15 }}
                                                            onChange={e => setSettings(s => ({...s, [key]:e.target.checked}))} />
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Logo */}
                                        <div className="inner-card">
                                            <span className="sec-label">Logo / Signature</span>
                                            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                                                <div style={{ width:48, height:48, flexShrink:0, borderRadius:8, border:`1px solid ${sigError ? 'var(--danger)' : 'var(--border)'}`, background:'var(--bg-input)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', position:'relative' }}>
                                                    {signatureUrl
                                                        ? sigError
                                                            ? <span style={{ color:'var(--danger)' }}>{IC.Alert}</span>
                                                            : <img src={signatureUrl} style={{ maxWidth:'100%', maxHeight:'100%', objectFit:'contain' }} />
                                                        : <span style={{ color:'var(--text-muted)' }}>{IC.ImgSm}</span>
                                                    }
                                                    {signatureUrl && (
                                                        <button onClick={removeSig} style={{ position:'absolute', top:0, right:0, background:'var(--danger)', color:'#fff', border:'none', padding:'2px 3px', borderBottomLeftRadius:5, cursor:'pointer', lineHeight:1 }}>{IC.X}</button>
                                                    )}
                                                </div>
                                                <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8 }}>
                                                    <label style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6, background: signatureUrl && !sigError ? '#333' : 'var(--accent)', color:'#fff', padding:'8px 12px', borderRadius:8, fontSize:12, fontWeight:700, cursor:'pointer' }}>
                                                        {IC.ImgPlus} {signatureUrl && !sigError ? 'Thay đổi Logo' : 'Tải Logo lên'}
                                                        <input type="file" accept="image/*" style={{ display:'none' }} onChange={handleSigUpload} />
                                                    </label>
                                                    {!signatureUrl && (
                                                        <input type="text" value={settings.watermarkText} placeholder="Hoặc nhập text watermark..."
                                                            onChange={e => setSettings(s => ({...s, watermarkText:e.target.value}))}
                                                            style={{ fontSize:12, padding:'8px 10px' }} />
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </>}
                                </div>

                                {/* Apply */}
                                <div style={{ padding:16, borderTop:'1px solid var(--border)' }}>
                                    <button onClick={() => { reProcessAll(); setSettingsOpen(false); }}
                                        style={{ width:'100%', padding:'15px 0', background:'var(--accent)', color:'#fff', border:'none', borderRadius:12, fontWeight:700, fontSize:15, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}
                                        onMouseDown={e => e.currentTarget.style.opacity='0.85'}
                                        onMouseUp={e => e.currentTarget.style.opacity='1'}
                                        onTouchStart={e => e.currentTarget.style.opacity='0.85'}
                                        onTouchEnd={e => e.currentTarget.style.opacity='1'}>
                                        {IC.Check} Áp dụng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
