<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bluer Exif Frame</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bluer Frame">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-base:        #0a0a0a;
            --bg-card:        #141414;
            --bg-elevated:    #1c1c1c;
            --bg-input:       #222222;
            --border:         #2e2e2e;
            --text-primary:   #f0f0f0;
            --text-secondary: #888888;
            --text-muted:     #555555;
            --accent:         #3b82f6;
            --accent-dim:     rgba(59,130,246,0.15);
            --danger:         #ef4444;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
        }
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-top:    env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        .modal-scroll::-webkit-scrollbar       { width: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-track { background: transparent; }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            height: 24px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px; width: 22px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -9px;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2), 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: #2e2e2e;
            border-radius: 2px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        input[type=text], input[type=number], input[type=date] {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type=text]:focus,
        input[type=number]:focus,
        input[type=date]:focus { border-color: var(--accent); }
        input[type=text]::placeholder,
        input[type=number]::placeholder { color: var(--text-muted); }

        input[type=color] {
            -webkit-appearance: none;
            width: 36px; height: 36px;
            border: none; border-radius: 8px;
            cursor: pointer; padding: 0; background: none;
        }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 8px; }
        input[type=color]::-webkit-color-swatch         { border: none; border-radius: 8px; }

        input[type=checkbox] { accent-color: var(--accent); }

        .btn-icon {
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px;
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .btn-icon:active { background: var(--border); }

        .hold-btn {
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 16px;
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.1s, border-color 0.1s;
            -webkit-user-select: none; user-select: none;
        }
        .hold-btn:active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .pixel-display {
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; min-width: 72px; text-align: center;
            color: var(--accent); font-weight: 700; font-size: 13px;
            padding: 6px 8px; cursor: text; transition: border-color 0.2s;
        }
        .pixel-display:hover { border-color: var(--accent); }

        .img-card   { background: #111; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .inner-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .sec-label  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; }
        .bottom-nav { background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-anim { animation: slideUp 0.22s cubic-bezier(0.16,1,0.3,1) both; }
    </style>
</head>
<body>
    <div id="root" style="flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;"></div>

        const { useState, useEffect, useRef, useCallback, useMemo } = React;
